services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: mantisbt
      MARIADB_USER: mantisbt
      MARIADB_PASSWORD: mantisbt
      MARIADB_ROOT_PASSWORD: mantisbt-root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-hdb", "-umantisbt", "-pmantisbt"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile.tester-env
    image: ${IMAGE_TAG:-tester-env-mantisbt:dev}
    ports:
      - "${PORT:-18317}:80"
    depends_on:
      db:
        condition: service_healthy

  install:
    image: curlimages/curl:8.12.1
    depends_on:
      app:
        condition: service_started
    command:
      - /bin/sh
      - -ec
      - >-
        curl --fail-with-body -sS --retry 30 --retry-connrefused --retry-delay 1
        --data 'install=2&db_type=mysqli&hostname=db&database_name=mantisbt&db_username=mantisbt&db_password=mantisbt&admin_username=root&admin_password=mantisbt-root&timezone=UTC&path='
        http://app/admin/install.php

volumes:
  db-data:
